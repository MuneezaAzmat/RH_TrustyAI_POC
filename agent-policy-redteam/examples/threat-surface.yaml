- risk_card:
    risk_id: atlas-ip-information-in-prompt
    risk_name: IP information in prompt
    risk_description: Copyrighted information or other intellectual property might
      be included as a part of the prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Copyrighted information or intellectual property is included within the
      prompts or queries sent to generative AI systems.
    threat_source: Employees using generative AI systems via API, UI, or other interfaces
      on corporate or personal devices.
    vulnerability: Failure to genericize requests, remove references to IP, or genericize
      variable names when sharing code or queries.
    consequence: Exposure of company IP, strategy, or proprietary code to a third-party
      system.
    impact: Regulatory or legal action, loss of competitive advantage through revealed
