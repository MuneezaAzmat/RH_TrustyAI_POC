  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-copyright-infringement
    risk_name: Copyright infringement
    risk_description: A model might generate content that is similar or identical
      to existing work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Generative AI systems may produce programming code or multimedia content
      that replicates existing work protected by open-source software (OSS) licenses
      or commercial terms of use requiring attribution.
    threat_source: Generative AI tools trained on open-source software repositories
      or proprietary datasets, such as GitHub CoPilot or latent diffusion models.
    vulnerability: The inability of current detection tools to reliably verify if
      an employee's work is original and the tendency of users to omit required attribution
      for AI-generated output.
    consequence: Firms may face legal liability for violating open-source licenses
      or commercial terms of use that mandate specific attribution.
    impact: The firm may suffer damage to its external reputation and face legal or
      compliance challenges regarding the ownership and use of intellectual property.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-decision-bias
    risk_name: Decision bias
    risk_description: Decision bias occurs when one group is unfairly advantaged over
      another due to decisions of the model. This might be caused by biases in the
      data and also amplified as a result of the model's training.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Generative AI outputs may result in poor, biased, or unethical business
      practices and decisions.
    threat_source: Biases present in the training data or those amplified during the
      model's training process.
    vulnerability: The inherent imperfection in the accuracy of generative AI systems
      and the potential for employees to fail in manually verifying outputs.
    consequence: The implementation of unfair business decisions that advantage one
      group over another.
    impact: Reputational and financial harm to the company, as well as potential non-compliance
      with applicable regulations and laws.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
