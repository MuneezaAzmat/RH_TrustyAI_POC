- risk_card:
    risk_id: atlas-confidential-information-in-data
    risk_name: Confidential information in data
    risk_description: Confidential information might be included as part of the data
      that is used to train or tune the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential information, including Intellectual Property (IP), Non-Public
      Information (NPI), and Personally Identifiable Information (PII), may be included
      in the queries or inputs provided to external generative AI services.
    threat_source: Employees using external generative AI services like ChatGPT, Bing
      with GPT, or Bard for business tasks.
    vulnerability: Failure by employees to genericize requests, remove references
      to the firm, or strip sensitive data from code and queries before submission.
    consequence: Sensitive firm data becomes part of the training or tuning datasets
      used by third-party external generative AI providers.
    impact: Potential loss of intellectual property, breach of compliance requirements,
      and exposure of private client or firm information to external entities.
