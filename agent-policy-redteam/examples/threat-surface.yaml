      ChatGPT, Microsoft's Bing, or Google's Bard.
    vulnerability: The use of third-party generative AI systems that are external
      to the firm and lack the same internal safeguards as hosted services.
    consequence: Confidential firm data, including IP and NPI, is transmitted to and
      processed by external third-party systems.
    impact: Potential loss of intellectual property, failure to meet compliance requirements,
