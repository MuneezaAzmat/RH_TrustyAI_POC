    risk_description: Laws and other restrictions can limit or prohibit the use of
      some data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The firm may utilize sensitive or regulated data within external generative
      AI services like ChatGPT, Bing, or Bard in violation of legal mandates.
    threat_source: The use of external, non-firm-hosted generative AI services for
      processing data.
    vulnerability: A lack of internal controls or oversight regarding how data is
      input into third-party LLMs and text generation tools.
