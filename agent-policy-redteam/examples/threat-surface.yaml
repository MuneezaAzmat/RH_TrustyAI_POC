- risk_card:
    risk_id: atlas-personal-information-in-data
    risk_name: Personal information in data
    risk_description: Inclusion or presence of personal identifiable information (PII)
      and sensitive personal information (SPI) in the data used for training or fine
      tuning the model might result in unwanted disclosure of that information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Personally identifiable information (PII) and sensitive personal information
      (SPI) may be included in the datasets used to train or fine-tune external generative
      AI services like ChatGPT, Bing, or Bard.
    threat_source: Employees using external generative AI services from corporate
      devices or using corporate identities to interact with these systems.
    vulnerability: The use of external generative AI services that are not hosted
      within the firm, where the firm may lack the keys to the service's data vault
      to protect held data.
    consequence: Unwanted disclosure of PII and SPI through the outputs of the external
      generative AI model.
    impact: The company may face regulatory or legal action, or suffer reputational
      damage due to the public exposure of sensitive information.
