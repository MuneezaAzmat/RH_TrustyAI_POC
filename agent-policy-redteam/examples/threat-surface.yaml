- risk_card:
    risk_id: atlas-data-privacy-rights
    risk_name: Data privacy rights alignment
    risk_description: Applicable laws can establish data subject rights such as opt-out
      rights, right to access, and right to be forgotten. Synthetic data might raise
      unique concerns, such as the potential for reidentification of individuals from
      seemingly anonymous synthetic data. Data subject rights might also be relevant
      in scenarios where synthetic data is derived from sensitive or personal information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Individuals may be re-identified from seemingly anonymous synthetic data
      generated by external LLMs like ChatGPT, Bing, or Bard.
    threat_source: External generative AI services and the synthetic data they produce.
    vulnerability: The potential for synthetic data to retain patterns from sensitive
      or personal information used during the model's training or derivation process.
    consequence: A breach of data subject rights, including the inability to effectively
      exercise the right to be forgotten or the right to opt-out.
    impact: Legal non-compliance with applicable data privacy laws and the compromise
      of individual privacy through the exposure of sensitive information.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-generated-content-ownership
    risk_name: Generated content ownership and IP
    risk_description: Legal uncertainty about the ownership and intellectual property
      rights of AI-generated content.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Legal uncertainty regarding the ownership and intellectual property rights
      of content produced by tools like Stable Diffusion, Midjourney AI, or OpenAI's
      DALL-E.
    threat_source: Generative AI systems and multimedia creation tools used within
      the organization.
    vulnerability: The lack of clear legal frameworks or policy guidance regarding
      the IP status of outputs from latent diffusion models and other generative systems.
    consequence: Disputes over whether the organization or the AI provider holds the
      rights to generated assets.
    impact: Potential legal litigation and loss of proprietary control over creative
      or technical assets produced via CoPilot or image generation tools.
