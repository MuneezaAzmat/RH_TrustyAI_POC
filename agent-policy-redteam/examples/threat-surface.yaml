- risk_card:
    risk_id: atlas-revealing-confidential-information
    risk_name: Revealing confidential information
    risk_description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: External generative AI services may output confidential company information,
      such as proprietary IP, strategic plans, or data subject to safe harbor statements,
      within their generated responses.
    threat_source: The use of external text generation services like OpenAI's ChatGPT,
      Microsoft's Bing, or Google's Bard that process firm-provided data.
    vulnerability: The inclusion of sensitive information within training datasets,
      fine-tuning data, or user prompts provided to third-party AI models.
    consequence: The public exposure of information that could be used to reverse
      engineer company systems or reveal protected corporate strategies.
    impact: Significant reputational damage to the company and exposure to regulatory
      or legal actions.
