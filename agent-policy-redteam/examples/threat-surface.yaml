entries:
- risk_card:
    risk_id: atlas-over-or-under-reliance
    risk_name: Over- or under-reliance
    risk_description: In AI-assisted decision-making tasks, reliance measures how
      much a person trusts (and potentially acts on) a model's output. Over-reliance
      occurs when a person puts too much trust in a model, accepting a model's output
      when the model's output is likely incorrect. Under-reliance is the opposite,
      where the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    confidence: 0.9607686996459961
    grounding_confidence: high
    threat: Users may blindly accept AI system outputs as compliant with company directives
      or fail to report system infringements due to misplaced trust in the technology.
    threat_source: Users interacting with AI systems under the company's monitoring
      and acceptable use framework.
    vulnerability: A lack of rigorous verification processes by management and users
      to ensure AI outputs align with the specific standards and directives outlined
      in the policy.
    consequence: The use of systems in a manner that infringes on the standards of
      acceptable use without detection or reporting.
    impact: Regulatory non-compliance and the erosion of the company's ability to
      ensure system use adheres to applicable laws and internal directives.
