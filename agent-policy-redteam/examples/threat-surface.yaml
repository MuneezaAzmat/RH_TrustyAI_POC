- risk_card:
    risk_id: atlas-model-usage-rights
    risk_name: Model usage rights restrictions
    risk_description: Terms of service, licenses, or other rules restrict the use
      of certain models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Users may fail to provide required attribution for generative AI output
      or inadvertently violate open-source licenses embedded in the training data.
    threat_source: Employees using commercial generative AI tools or systems trained
      on open-source software (OSS) repositories.
    vulnerability: The inability to reliably detect if an output is original or derived
      from specific OSS code, combined with the user's failure to follow external
      Terms of Use.
    consequence: The firm may face legal liability for copyright violations or breaches
      of external terms of service.
    impact: The firm's external reputation may be compromised, and the use of output
      may be invalidated for proprietary or copyrighted work.
