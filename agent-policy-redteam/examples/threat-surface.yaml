- risk_card:
    risk_id: atlas-hallucination
    risk_name: Hallucination
    risk_description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI systems may produce convincing but factually incorrect answers,
      such as inaccurate IT instructions, distorted statistics, or incorrect legal,
      tax, and accounting advice.
    threat_source: Generative AI systems that lack faithfulness or groundedness in
      their fact-based output.
    vulnerability: The inherent tendency of these systems to 'hallucinate' and the
      fact that they may not be current on legislation or aware of organizational
      culture and industry intricacies.
    consequence: Employees may make key decisions, public claims, or technical configurations
      based on erroneous information.
    impact: Severe organizational issues including data loss, system damage, regulatory
      non-compliance regarding GDPR or other laws, and harm resulting from suggestions
      that do not align with industry or organizational needs.
