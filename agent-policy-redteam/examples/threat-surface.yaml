- risk_card:
    risk_id: atlas-legal-accountability
    risk_name: Legal accountability
    risk_description: Determining who is responsible for an AI model is challenging
      without good documentation and governance processes. The use of synthetic data
      in model development adds further complexity, since the lack of standardized
      frameworks for recording synthetic data design choices and verification steps
      makes accountability harder to establish.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may fail to provide required attribution for generative AI outputs
      or use them as proprietary work, violating external terms of use and open-source
      licenses.
    threat_source: Employees using generative AI for internal documents like HR appraisals
      or external communications and programming code.
    vulnerability: The inability of current detection tools to reliably distinguish
      between original employee work and AI-generated output, combined with the complexity
      of tracking synthetic data design choices.
    consequence: The firm may face liability for terms of use violations, copyright
      infringements, or breaches of approved open-source licenses.
    impact: Legal disputes regarding employee grievances, loss of proprietary IP status
      for work products, and damage to the firm's external reputation.
