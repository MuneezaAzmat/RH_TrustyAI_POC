- risk_card:
    risk_id: atlas-unreliable-source-attribution
    risk_name: Unreliable source attribution
    risk_description: Source attribution is the AI system's ability to describe from
      what training data it generated a portion or all its output. Since current techniques
      are based on approximations, attributions might be incorrect.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The AI system provides incorrect or approximate attributions regarding
      the training data used to generate specific outputs.
    threat_source: Current AI technical limitations in source attribution techniques.
    vulnerability: The reliance on approximation-based attribution methods that fail
      to accurately identify the origin of generated content.
    consequence: Users may fail to correctly attribute output as required by terms
      of use, leading to potential copyright violations or invalidation of proprietary
      work.
    impact: Organizations and individuals face legal, ethical, and copyright risks,
      as well as conflicts with other firms using similar outputs.
