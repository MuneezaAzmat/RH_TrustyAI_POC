- risk_card:
    risk_id: atlas-untraceable-attribution
    risk_name: Untraceable attribution
    risk_description: The content of the training data used for generating the model's
      output is not accessible.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may use generative AI outputs, such as programming code, without
      providing the required attribution mandated by the external systems' Terms of
      Use.
    threat_source: The inability to access or identify the specific training data
      content, such as open-source software (OSS) code from common repositories, used
      to generate the output.
    vulnerability: The lack of dependable tools to detect whether an employee's work
      is original or derived from specific OSS licenses that the firm has approved.
    consequence: The firm may become liable for violations of external terms of use
      and fail to honor applicable open-source licenses.
    impact: The firm faces potential legal liability, compromise of its external reputation,
      and the unauthorized use of non-proprietary intellectual property.
