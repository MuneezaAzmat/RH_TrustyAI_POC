- risk_card:
    risk_id: atlas-exposing-personal-information
    risk_name: Exposing personal information
    risk_description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: External generative AI services may reveal PII or SPI within their generated
      outputs if such data is included in training, fine-tuning, synthetic data seeds,
      or user prompts.
    threat_source: External generative AI services (e.g., ChatGPT, Bing with GPT,
      Bard) and the employees interacting with them.
    vulnerability: The use of sensitive data within the model's input or training
      lifecycle when accessing services running external to the firm.
    consequence: The public exposure of sensitive personal information or proprietary
      data through the model's output.
    impact: Tarnished company reputation, regulatory or legal action, and potential
      violation of safe harbor statements.
