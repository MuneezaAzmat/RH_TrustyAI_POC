- risk_card:
    risk_id: atlas-spreading-disinformation
    risk_name: Spreading disinformation
    risk_description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may use generative AI to generate misleading or false internal documents,
      such as employee appraisals, without sufficient human oversight or correct attribution.
    threat_source: Employees or managers using generative AI systems to produce internal
      communications like emails or HR documents.
    vulnerability: The lack of human authorship and the potential for users to bypass
      necessary reviews or fail to attribute the AI-generated content correctly.
    consequence: The production of inaccurate or deceptive internal records that do
      not reflect actual human activity or intent.
    impact: Legal and ethical grievances from employees, such as upheld complaints
      regarding unfair appraisals, and a breakdown of trust within the organizational
      structure.
