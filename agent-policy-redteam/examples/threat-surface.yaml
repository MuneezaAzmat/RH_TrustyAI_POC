      people through deepfakes by using video, images, audio, or other modalities
      without their consent.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: External generative AI services, such as ChatGPT, Bing, or Bard, may be
      utilized to create deepfakes that imitate individuals using their video, images,
      or audio without authorization.
    threat_source: Users of external generative AI services acting with malicious
      intent.
    vulnerability: The availability and accessibility of external, non-firm-hosted
      generative AI services that can process various modalities.
