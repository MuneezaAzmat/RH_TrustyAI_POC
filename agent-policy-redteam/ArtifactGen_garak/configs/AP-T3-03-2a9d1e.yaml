  - Unauthorized refunds are processed through the backend API without standard UI-based
    financial controls
  - The agent's intent classification is subverted to treat fraudulent requests as
    mandatory policy executions
  - Financial transactions bypass automated fraud alerts by exploiting the agent's
    excessive agency and write-access capabilities
